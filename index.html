<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Image Generator Gratis</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background: #0b0f19; color: #f8fafc; display: flex; justify-content: center; align-items: center; min-height: 100vh; padding: 20px; }
        .card { background: #1e293b; padding: 24px; border-radius: 16px; max-width: 520px; width: 100%; box-shadow: 0 15px 35px rgba(0,0,0,0.6); border: 1px solid #334155; }
        h1 { font-size: 1.4rem; margin-bottom: 6px; text-align: center; color: #38bdf8; }
        p.subtitle { font-size: 0.85rem; text-align: center; color: #94a3b8; margin-bottom: 20px; }
        label { font-size: 0.85rem; color: #cbd5e1; display: block; margin-top: 12px; margin-bottom: 4px; }
        textarea, select, button { width: 100%; padding: 12px; border-radius: 8px; border: none; outline: none; font-size: 0.95rem; }
        textarea { background: #0f172a; color: #fff; resize: vertical; min-height: 80px; border: 1px solid #475569; }
        textarea:focus, select:focus { border-color: #38bdf8; }
        select { background: #0f172a; color: #fff; border: 1px solid #475569; cursor: pointer; }
        button { background: #0284c7; color: white; font-weight: bold; cursor: pointer; transition: 0.2s; margin-top: 16px; }
        button:hover { background: #02689c; }
        button:disabled { background: #475569; cursor: not-allowed; }
        .result-box { margin-top: 20px; text-align: center; min-height: 250px; display: flex; flex-direction: column; align-items: center; justify-content: center; background: #0f172a; border-radius: 10px; overflow: hidden; border: 1px dashed #475569; position: relative; }
        img { width: 100%; height: auto; display: block; border-radius: 8px; }
        .status { font-size: 0.9rem; color: #94a3b8; padding: 20px; }
        .btn-download { background: #10b981; margin-top: 10px; display: none; text-decoration: none; padding: 10px; border-radius: 8px; color: white; font-weight: bold; text-align: center; font-size: 0.9rem; }
        .btn-download:hover { background: #059669; }
    </style>
</head>
<body>

<div class="card">
    <h1>AI Image Generator</h1>
    <p class="subtitle">Gratis Selamanya • Tanpa Batasan API Key</p>
    
    <label for="promptInput">Deskripsi Gambar (Prompt):</label>
    <textarea id="promptInput" placeholder="Contoh: Futuristic cyberpunk city at night, neon lights, highly detailed, 4k..."></textarea>

    <label for="modelSelect">Pilih Gaya / Model AI:</label>
    <select id="modelSelect">
        <option value="flux">Flux (Kualitas Sangat Tinggi)</option>
        <option value="stable-diffusion">Stable Diffusion XL</option>
    </select>
    
    <button id="generateBtn" onclick="generateImage()">Buat Gambar Sekarang</button>

    <div class="result-box" id="resultBox">
        <p class="status" id="statusText">Gambar hasil AI akan muncul di sini</p>
    </div>
    
    <a id="downloadBtn" class="btn-download" download="ai-image.jpg">Unduh Gambar</a>
</div>

<script>
async function generateImage() {
    const prompt = document.getElementById('promptInput').value.trim();
    const model = document.getElementById('modelSelect').value;
    const statusText = document.getElementById('statusText');
    const resultBox = document.getElementById('resultBox');
    const btn = document.getElementById('generateBtn');
    const downloadBtn = document.getElementById('downloadBtn');

    if (!prompt) {
        alert('Harap masukkan deskripsi gambar terlebih dahulu!');
        return;
    }

    btn.disabled = true;
    downloadBtn.style.display = 'none';
    resultBox.innerHTML = '<p class="status">Sedang meracik piksel gambar, mohon tunggu sebentar...</p>';

    try {
        // Menggunakan endpoint publik gratis selamanya
        const seed = Math.floor(Math.random() * 10000000);
        const encodedPrompt = encodeURIComponent(prompt);
        const imageUrl = `https://image.pollinations.ai/prompt/${encodedPrompt}?width=1024&height=1024&model=${model}&nologo=true&seed=${seed}`;

        // Validasi muat gambar
        const img = new Image();
        img.src = imageUrl;
        
        img.onload = function() {
            resultBox.innerHTML = '';
            resultBox.appendChild(img);
            downloadBtn.href = imageUrl;
            downloadBtn.style.display = 'block';
            btn.disabled = false;
        };

        img.onerror = function() {
            throw new Error("Gagal memuat gambar dari server AI.");
        };

    } catch (err) {
        resultBox.innerHTML = `<p class="status" style="color: #ef4444;">Terjadi kesalahan: ${err.message}</p>`;
        btn.disabled = false;
    }
}
</script>

</body>
</html>
