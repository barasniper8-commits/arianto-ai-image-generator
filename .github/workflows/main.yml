name: Windows RDP via Ngrok

on:
  workflow_dispatch:
    inputs:
      ngrok_authtoken:
        description: 'Ngrok Auth Token (Dapatkan gratis di dashboard ngrok.com)'
        required: true
        type: string
      password:
        description: 'Password untuk user runneradmin'
        required: true
        default: 'SecretPass123!'

jobs:
  windows-vps:
    runs-on: windows-latest
    timeout-minutes: 360

    steps:
    - name: Mengaktifkan RDP dan Konfigurasi Firewall
      run: |
        Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' -Name "fDenyTSConnections" -Value 0
        Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' -Name "UserAuthentication" -Value 1
        Enable-NetFirewallRule -DisplayGroup "Remote Desktop"
        Write-Host "RDP berhasil diaktifkan."

    - name: Mengatur Password Administrator
      run: |
        net user runneradmin "${{ github.event.inputs.password }}"
        Write-Host "Password administrator berhasil diatur."

    - name: Install & Setup Ngrok
      run: |
        winget install --id Ngrok.Ngrok -e --accept-source-agreements --accept-package-agreements
        
        # Refresh PATH agar ngrok langsung terbaca di sesi PowerShell ini
        $env:Path = [System.Environment]::GetEnvironmentVariable('Path', 'Machine') + ';' + [System.Environment]::GetEnvironmentVariable('Path', 'User')
        
        # Konfigurasi Authtoken
        ngrok config add-authtoken "${{ github.event.inputs.ngrok_authtoken }}"
        
        # Update ngrok ke versi terbaru untuk mengatasi error versi lawas
        ngrok update
        Write-Host "Ngrok berhasil diinstal, dikonfigurasi, dan diperbarui."

    - name: Menjalankan Ngrok TCP Tunnel (Port 3389)
      run: |
        # Refresh PATH kembali untuk memastikan
        $env:Path = [System.Environment]::GetEnvironmentVariable('Path', 'Machine') + ';' + [System.Environment]::GetEnvironmentVariable('Path', 'User')
        
        Start-Process ngrok -ArgumentList "tcp 3389" -NoNewWindow
        Start-Sleep -Seconds 7
        
        try {
            $response = Invoke-RestMethod -Uri "http://127.0.0.1:4040/api/tunnels" -ErrorAction Stop
            $tcpUrl = $response.tunnels | Where-Object { $_.proto -eq "tcp" } | Select-Object -ExpandProperty public_url 2>$null
            if (-not $tcpUrl) {
                $tcpUrl = ($response.tunnels | Where-Object { $_.proto -eq "tcp" }).public_url
            }
            
            Write-Host "========================================================" -ForegroundColor Green
            Write-Host " KONEKSI RDP BERHASIL DIBUAT!" -ForegroundColor Green
            Write-Host " Alamat RDP (Host:Port) : $tcpUrl" -ForegroundColor Cyan
            Write-Host " Username               : runneradmin" -ForegroundColor Yellow
            Write-Host " Password               : ${{ github.event.inputs.password }}" -ForegroundColor Yellow
            Write-Host "========================================================" -ForegroundColor Green
        } catch {
            Write-Host "Gagal mengambil URL Ngrok dari API lokal. Pastikan Auth Token valid." -ForegroundColor Red
        }

    - name: Menjaga Runner Tetap Aktif (Maksimal 6 Jam)
      run: |
        Write-Host "VPS Windows aktif. Jangan menutup tab Actions ini selama sesi berjalan."
        for ($i = 1; $i -le 360; $i++) {
            Start-Sleep -Seconds 60
        }
